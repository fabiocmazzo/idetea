<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- IDE TEA: copo de chá gelado com gelo. "Just code. Add ice." -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#253246"/>
      <stop offset="1" stop-color="#151c28"/>
    </linearGradient>
    <linearGradient id="tea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b54a"/>
      <stop offset="1" stop-color="#c7671c"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#bfe6ff" stop-opacity="0.75"/>
    </linearGradient>
    <clipPath id="glass">
      <path d="M70 60 H186 L172 210 Q170 222 158 222 H98 Q86 222 84 210 Z"/>
    </clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- canudo -->
  <path d="M150 112 L176 30 L190 34" fill="none" stroke="#5ec8b8" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- chá -->
  <g clip-path="url(#glass)">
    <rect x="60" y="96" width="140" height="140" fill="url(#tea)"/>
    <rect x="60" y="96" width="140" height="8" fill="#ffd27a" opacity="0.7"/>
    <!-- gelo -->
    <g fill="url(#ice)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3">
      <rect x="88" y="80" width="40" height="40" rx="7" transform="rotate(-14 108 100)"/>
      <rect x="126" y="92" width="36" height="36" rx="7" transform="rotate(11 144 110)"/>
      <rect x="104" y="128" width="32" height="32" rx="6" transform="rotate(6 120 144)" opacity="0.8"/>
    </g>
  </g>
  <!-- copo -->
  <path d="M70 60 H186 L172 210 Q170 222 158 222 H98 Q86 222 84 210 Z" fill="#ffffff" fill-opacity="0.08" stroke="#e8f1ff" stroke-width="7" stroke-linejoin="round"/>
  <path d="M86 76 L96 196" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
</svg>
