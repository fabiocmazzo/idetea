[workspace]
resolver = "3"
members = ["crates/tea-core", "crates/tea-editor", "crates/tea-app", "crates/ext/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
iced = "0.14"
iced-code-editor = "0.5"
tea-core = { path = "crates/tea-core" }
tea-editor = { path = "crates/tea-editor" }
tea-ext-demo = { path = "crates/ext/tea-ext-demo" }

[profile.release]
lto = "thin"
