[workspace]
resolver = "3"
members = ["crates/tea-core", "crates/tea-declarative-ui", "crates/tea-plugins", "crates/tea-editor", "crates/tea-lsp", "crates/tea-dap", "crates/tea-skills", "crates/tea-app", "crates/ext/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
iced = "0.14"
iced-code-editor = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "1"
toml_edit = "0.25"
trash = "5"
rfd = "0.17"
libc = "0.2"
notify = { version = "8", default-features = false }
ignore = "0.4"
globset = "0.4"
similar = { version = "2", default-features = false }
regex = "1"
serde_json = "1"
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
sys-locale = "0.3"
fluent-syntax = "0.12"
tea-core = { path = "crates/tea-core" }
tea-declarative-ui = { path = "crates/tea-declarative-ui" }
tea-plugins = { path = "crates/tea-plugins" }
tea-ext-ui = { path = "crates/ext/tea-ext-ui" }
tea-skills = { path = "crates/tea-skills" }
tea-editor = { path = "crates/tea-editor" }
tea-lsp = { path = "crates/tea-lsp" }
tea-dap = { path = "crates/tea-dap" }
tea-ext-filetree = { path = "crates/ext/tea-ext-filetree" }
tea-ext-statusbar = { path = "crates/ext/tea-ext-statusbar" }
tea-ext-search = { path = "crates/ext/tea-ext-search" }
tea-ext-problems = { path = "crates/ext/tea-ext-problems" }
tea-ext-terminal = { path = "crates/ext/tea-ext-terminal" }
tea-ext-git = { path = "crates/ext/tea-ext-git" }
tea-ext-debug = { path = "crates/ext/tea-ext-debug" }
tea-ext-references = { path = "crates/ext/tea-ext-references" }
tea-ext-outline = { path = "crates/ext/tea-ext-outline" }
tea-ext-calls = { path = "crates/ext/tea-ext-calls" }
tea-ext-preview = { path = "crates/ext/tea-ext-preview" }

[profile.release]
lto = "thin"

# Executável para distribuir (`just dist`): o release sem os símbolos de depuração.
[profile.dist]
inherits = "release"
strip = true
