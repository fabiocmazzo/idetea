[workspace]
resolver = "3"
members = ["crates/tea-core", "crates/tea-declarative-ui", "crates/tea-plugins", "crates/tea-editor", "crates/tea-lsp", "crates/tea-dap", "crates/tea-skills", "crates/tea-table", "crates/tea-acp", "crates/tea-app", "crates/ext/*"]

[workspace.package]
version = "0.15.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
iced = "0.14"
iced-code-editor = "0.7"
serde = { version = "1", features = ["derive"] }
toml = "1"
toml_edit = "0.25"
trash = "5"
rfd = "0.17"
libc = "0.2"
notify = "8"
ignore = "0.4"
globset = "0.4"
similar = { version = "2", default-features = false }
regex = "1"
# Encodings além de UTF-8 (RFC 0021); já vinha no lock pelo rust-i18n.
encoding_rs = "0.8"
serde_json = "1"
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
sys-locale = "0.3"
fluent-syntax = "0.12"
tea-core = { path = "crates/tea-core" }
tea-declarative-ui = { path = "crates/tea-declarative-ui" }
tea-plugins = { path = "crates/tea-plugins" }
tea-ext-ui = { path = "crates/ext/tea-ext-ui" }
tea-skills = { path = "crates/tea-skills" }
tea-table = { path = "crates/tea-table" }
tea-editor = { path = "crates/tea-editor" }
tea-lsp = { path = "crates/tea-lsp" }
tea-acp = { path = "crates/tea-acp" }
tea-ext-acp = { path = "crates/ext/tea-ext-acp" }
tea-dap = { path = "crates/tea-dap" }
tea-ext-filetree = { path = "crates/ext/tea-ext-filetree" }
tea-ext-statusbar = { path = "crates/ext/tea-ext-statusbar" }
tea-ext-search = { path = "crates/ext/tea-ext-search" }
tea-ext-problems = { path = "crates/ext/tea-ext-problems" }
tea-ext-memory = { path = "crates/ext/tea-ext-memory" }
tea-ext-terminal = { path = "crates/ext/tea-ext-terminal" }
tea-ext-git = { path = "crates/ext/tea-ext-git" }
tea-ext-debug = { path = "crates/ext/tea-ext-debug" }
tea-ext-references = { path = "crates/ext/tea-ext-references" }
tea-ext-outline = { path = "crates/ext/tea-ext-outline" }
tea-ext-calls = { path = "crates/ext/tea-ext-calls" }
tea-ext-preview = { path = "crates/ext/tea-ext-preview" }

[profile.release]
lto = "thin"

# Executável para distribuir (`just dist`): o release sem os símbolos de depuração.
[profile.dist]
inherits = "release"
strip = true

# Fork do iced-code-editor (branch `idetea-main`): o upstream mais o texto virtual dos inlay hints (RFC 0018), que vai
# como PR para o upstream. O patch sai quando entrar (RFC 0017, ADR 0001).
[patch.crates-io]
iced-code-editor = { git = "https://github.com/fabiocmazzo/iced-code-editor", rev = "cf623d80ca6363a62aa85003c4722af7d14f5768" }
