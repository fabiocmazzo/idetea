[workspace]
resolver = "3"
members = ["crates/tea-core", "crates/tea-editor", "crates/tea-lsp", "crates/tea-app", "crates/ext/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
iced = "0.14"
iced-code-editor = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "1"
trash = "5"
ignore = "0.4"
regex = "1"
serde_json = "1"
tea-core = { path = "crates/tea-core" }
tea-editor = { path = "crates/tea-editor" }
tea-lsp = { path = "crates/tea-lsp" }
tea-ext-filetree = { path = "crates/ext/tea-ext-filetree" }
tea-ext-statusbar = { path = "crates/ext/tea-ext-statusbar" }
tea-ext-search = { path = "crates/ext/tea-ext-search" }
tea-ext-problems = { path = "crates/ext/tea-ext-problems" }

[profile.release]
lto = "thin"
