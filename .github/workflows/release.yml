# Versão com executáveis para Linux (x86_64 e aarch64), macOS (aarch64) e Windows (x86_64):
# .tar.gz, AppImage, .zip e SHA256SUMS.
#
# - Tag `v*` (ex.: `git tag v0.1.0 && git push origin v0.1.0`): testa, gera os pacotes e publica a versão no GitHub.
#   A tag precisa bater com a versão do Cargo.toml.
# - "Run workflow" na aba Actions (workflow_dispatch): só gera os pacotes, como artefatos da execução, sem publicar
#   nada. Serve para conferir antes da primeira tag.
name: Versão

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu mais antigo = glibc mais antiga: o executável roda em mais distros.
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.arch }}
      - name: Tag igual à versão
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "A tag $GITHUB_REF_NAME não bate com a versão $version do Cargo.toml" >&2
            exit 1
          fi
      - name: Testes
        # Os testes com clangd, gdb e plugins WASM se pulam quando faltam as ferramentas.
        run: cargo test --locked --workspace
      - name: Pacotes
        run: packaging/dist.sh
      - name: Executável roda
        run: |
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP"/idetea-*/idetea --version
      - uses: actions/upload-artifact@v7
        with:
          name: idetea-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-macos-aarch64
      - name: Testes
        run: cargo test --locked --workspace
      - name: Pacote macOS (.tar.gz + IDE TEA.app)
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          cargo build --locked --profile dist -p tea-app
          name="idetea-$version-aarch64-macos"
          pkg="dist/$name"
          rm -rf dist
          mkdir -p "$pkg/licenses"
          cp target/dist/idetea assets/idetea.svg LICENSE README.md "$pkg/"
          cp crates/tea-core/assets/NOTICE.md "$pkg/licenses/NOTICE.md"
          cp crates/tea-core/assets/fonts/OFL.txt "$pkg/licenses/JetBrainsMono-OFL.txt"
          cp crates/tea-core/assets/seti/LICENSE.txt "$pkg/licenses/Seti-LICENSE.txt"
          cp crates/tea-core/assets/syntaxes/LICENSE-ziex.txt "$pkg/licenses/Ziex-LICENSE.txt"
          cp crates/tea-core/assets/syntaxes/LICENSE-zig-sublime.txt "$pkg/licenses/sublime-zig-language-LICENSE.txt"
          app="$pkg/IDE TEA.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          cp target/dist/idetea "$app/MacOS/idetea"
          cp assets/idetea.svg "$app/Resources/idetea.svg"
          cat > "$app/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>IDE TEA</string>
            <key>CFBundleDisplayName</key><string>IDE TEA</string>
            <key>CFBundleIdentifier</key><string>dev.idetea.app</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>idetea</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "$pkg/IDE TEA.app"
          codesign --verify --deep --strict "$pkg/IDE TEA.app"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "$pkg"
          target/dist/idetea --version
      - uses: actions/upload-artifact@v7
        with:
          name: idetea-macos-aarch64
          path: dist/*.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-windows-x86_64
      - name: Testes
        run: cargo test --locked --workspace
      - name: Pacote Windows (.zip e instalador Inno Setup .exe)
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          cargo build --locked --profile dist -p tea-app
          $name = "idetea-$version-x86_64-windows"
          $pkg = "dist/$name"
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Force -Path "$pkg/licenses" | Out-Null
          Copy-Item target/dist/idetea.exe, assets/idetea.svg, assets/idetea.ico, LICENSE, README.md "$pkg/"
          Copy-Item crates/tea-core/assets/NOTICE.md "$pkg/licenses/NOTICE.md"
          Copy-Item crates/tea-core/assets/fonts/OFL.txt "$pkg/licenses/JetBrainsMono-OFL.txt"
          Copy-Item crates/tea-core/assets/seti/LICENSE.txt "$pkg/licenses/Seti-LICENSE.txt"
          Copy-Item crates/tea-core/assets/syntaxes/LICENSE-ziex.txt "$pkg/licenses/Ziex-LICENSE.txt"
          Copy-Item crates/tea-core/assets/syntaxes/LICENSE-zig-sublime.txt "$pkg/licenses/sublime-zig-language-LICENSE.txt"
          Compress-Archive -Path "$pkg" -DestinationPath "dist/$name.zip"
          iscc "/DAppVersion=$version" packaging/windows/idetea.iss
          Remove-Item -Recurse -Force "$pkg"
          ./target/dist/idetea.exe --version
      - name: Assinar com SignPath Foundation (opcional, quando SIGNPATH_ORGANIZATION_ID estiver configurado)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'idetea' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: idetea-windows-unsigned
          wait-for-completion: true
          output-artifact-directory: dist
      - uses: actions/upload-artifact@v7
        with:
          name: idetea-windows-x86_64
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  publish:
    needs: [build, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # Só tag com hífen (v0.9.0-rc1) sai como pré-lançamento; as outras viram a "latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
