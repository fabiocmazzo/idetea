# Site no GitHub Pages (site/ + docs/features.md), a cada push na main que mexe neles, ou pela aba Actions.
# O Pages precisa estar ligado em Settings → Pages → Source: GitHub Actions.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/features.md", "docs/features.*.md", "assets/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Monta o site
        run: python3 site/build.py _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
