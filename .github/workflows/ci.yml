# Testes e clippy a cada push na main e em cada pull request (Linux, macOS e Windows).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: wasm32-wasip2
          - os: macos-14
            targets: ""
          - os: windows-latest
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # Os testes de crates/tea-plugins compilam o plugin de exemplo para este alvo no Linux.
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Testes
        # Os testes com clangd e gdb se pulam quando eles não estão instalados (e os de plugin, sem wasm32-wasip2).
        run: cargo test --locked --workspace
