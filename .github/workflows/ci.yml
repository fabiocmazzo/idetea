# Testes e clippy a cada push na main e em cada pull request (Linux, macOS e Windows).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Só linhas na informação de debug: os backtraces de um teste que falha continuam com arquivo e linha, mas
  # compila e liga mais rápido (no Windows, o PDB completo pesa muito) e o cache do `target` fica bem menor.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: wasm32-wasip2
            timeout: 15
          - os: macos-latest
            targets: ""
            timeout: 15
          # O runner do Windows é bem mais lento para compilar e para salvar o cache.
          - os: windows-latest
            targets: ""
            timeout: 30
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # Os testes de crates/tea-plugins compilam o plugin de exemplo para este alvo no Linux.
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Testes
        # Os testes com clangd e gdb se pulam quando eles não estão instalados (e os de plugin, sem wasm32-wasip2).
        run: cargo test --locked --workspace --no-fail-fast
