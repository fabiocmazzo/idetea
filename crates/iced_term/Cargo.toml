# Cópia do iced_term 0.8.0 (MIT, https://github.com/Harzu/iced_term, commit e0e90be2c160bd68f1bf544a51bf772d75b98ffc),
# trazida para o workspace pela ADR 0004 (RFC 0024). As mudanças daqui para a frente estão em UPSTREAM.md.
[package]
name = "iced_term"
version = "0.8.0"
description = "Terminal emulator widget powered by ICED framework and alacritty terminal backend (copy vendored into the TEA IDE)."
authors = ["Ilya Shvyryalkin <ilyashvy@gmail.com>"]
license = "MIT"
edition = "2021"
publish = false

[dependencies]
alacritty_terminal = "0.25.1"
iced = { workspace = true, features = ["canvas", "lazy", "advanced"] }
tokio = { version = "1.50.0", features = ["full"] }
iced_graphics = { version = "0.14.0", default-features = false }
iced_core = "0.14.0"
open = "5.3.3"
anyhow = "1.0.102"

# O código veio do upstream como está; o clippy do workspace reclamaria deste estilo dele.
[lints.clippy]
field_reassign_with_default = "allow"
