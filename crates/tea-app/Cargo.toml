[package]
name = "tea-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "idetea"
path = "src/main.rs"

[features]
default = ["ext-filetree", "ext-statusbar", "ext-search", "ext-problems", "ext-terminal", "ext-git", "ext-debug", "ext-references", "ext-outline", "ext-calls", "ext-preview", "ext-ui", "ext-memory"]
ext-filetree = ["dep:tea-ext-filetree"]
ext-statusbar = ["dep:tea-ext-statusbar"]
ext-search = ["dep:tea-ext-search"]
ext-problems = ["dep:tea-ext-problems"]
ext-terminal = ["dep:tea-ext-terminal"]
ext-git = ["dep:tea-ext-git"]
ext-debug = ["dep:tea-ext-debug"]
ext-references = ["dep:tea-ext-references"]
ext-outline = ["dep:tea-ext-outline"]
ext-calls = ["dep:tea-ext-calls"]
ext-preview = ["dep:tea-ext-preview"]
ext-ui = ["dep:tea-ext-ui"]
ext-memory = ["dep:tea-ext-memory"]
# Protótipo da Fase 4 (docs/rfc/0002-plugins-wasm.md): fora do padrão até a RFC ser aprovada.
plugins = ["dep:tea-plugins"]

[dependencies]
iced = { workspace = true, features = ["advanced", "image"] }
image = "0.25"
tea-core.workspace = true
tea-editor.workspace = true
tea-ext-filetree = { workspace = true, optional = true }
tea-ext-statusbar = { workspace = true, optional = true }
tea-ext-search = { workspace = true, optional = true }
tea-ext-problems = { workspace = true, optional = true }
tea-ext-terminal = { workspace = true, optional = true }
tea-ext-git = { workspace = true, optional = true }
tea-ext-debug = { workspace = true, optional = true }
tea-ext-references = { workspace = true, optional = true }
tea-ext-outline = { workspace = true, optional = true }
tea-ext-calls = { workspace = true, optional = true }
tea-ext-preview = { workspace = true, optional = true }
tea-ext-ui = { workspace = true, optional = true }
tea-ext-memory = { workspace = true, optional = true }
tea-plugins = { workspace = true, optional = true }
tea-lsp.workspace = true
tea-dap.workspace = true
tea-skills.workspace = true
globset.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
rfd.workspace = true
ignore.workspace = true
notify.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
