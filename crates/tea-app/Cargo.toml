[package]
name = "tea-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "idetea"
path = "src/main.rs"

[features]
default = ["ext-filetree", "ext-statusbar", "ext-search", "ext-problems", "ext-terminal", "ext-git"]
ext-filetree = ["dep:tea-ext-filetree"]
ext-statusbar = ["dep:tea-ext-statusbar"]
ext-search = ["dep:tea-ext-search"]
ext-problems = ["dep:tea-ext-problems"]
ext-terminal = ["dep:tea-ext-terminal"]
ext-git = ["dep:tea-ext-git"]

[dependencies]
iced = { workspace = true, features = ["advanced"] }
tea-core.workspace = true
tea-editor.workspace = true
tea-ext-filetree = { workspace = true, optional = true }
tea-ext-statusbar = { workspace = true, optional = true }
tea-ext-search = { workspace = true, optional = true }
tea-ext-problems = { workspace = true, optional = true }
tea-ext-terminal = { workspace = true, optional = true }
tea-ext-git = { workspace = true, optional = true }
tea-lsp.workspace = true
tea-dap.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
rfd.workspace = true
ignore.workspace = true
notify.workspace = true
