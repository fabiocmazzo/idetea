[package]
name = "tea-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "idetea"
path = "src/main.rs"

[features]
default = ["ext-filetree", "ext-statusbar"]
ext-filetree = ["dep:tea-ext-filetree"]
ext-statusbar = ["dep:tea-ext-statusbar"]

[dependencies]
iced.workspace = true
tea-core.workspace = true
tea-editor.workspace = true
tea-ext-filetree = { workspace = true, optional = true }
tea-ext-statusbar = { workspace = true, optional = true }
