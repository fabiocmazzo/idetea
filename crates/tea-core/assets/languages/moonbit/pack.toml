format = 1
id = "moonbit"
name = "MoonBit"

[files]
# `.mbt.md`: Markdown com blocos MoonBit (o `moon lsp` atende com o mesmo languageId).
extensions = { mbt = "moonbit", mbti = "moonbit", "mbt.md" = "moonbit" }
syntaxes = ["moonbit.sublime-syntax", "moonbit-markdown.sublime-syntax"]

# Ícone de arquivo: caractere em assets/languages/icons.ttf (tools/language-icons.py) e cores no tema escuro e claro.
[icon]
glyph = "\uE001"
color = "#A78BFA"
light = "#6D4FC9"

[project]
markers = ["moon.mod"]

[lsp]
name = "moonbit"
command = "moon"
args = ["lsp"]

[[tasks]]
name = "moon check"
command = "moon check"

[[tasks]]
name = "moon build"
command = "moon build"

[[tasks]]
name = "moon test"
command = "moon test"

[[tasks]]
name = "moon fmt --check"
command = "moon fmt --check"
