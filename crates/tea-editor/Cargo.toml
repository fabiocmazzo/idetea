[package]
name = "tea-editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iced = { workspace = true, features = ["advanced", "image"] }
# Mesma versão do iced: só para ler as dimensões das imagens.
image = "0.25"
# Desenha páginas de PDF (puro Rust, Apache/MIT).
hayro = "0.8"
iced-code-editor = { workspace = true, features = ["lsp-process"] }
tea-lsp.workspace = true
tea-core.workspace = true
similar.workspace = true

[dev-dependencies]
iced_test = "0.14"
# Para o exemplo `large_render` (quadros com o estado da tela entre um e outro, e o PNG do quadro).
iced_runtime = "0.14"
png = "0.18"
